name: Improvement
description: Improve existing behavior without correcting a bug.
title: "improvement: "
labels:
  - type/improvement
  - status/needs-review
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the current situation and why should it improve?
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should the improvement provide?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Behavior, API, compatibility, performance, or security constraints.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will the improvement be considered complete?
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies

  - type: textarea
    id: notes
    attributes:
      label: Notes
