name: Feature
description: Add a new capability or behavior.
title: "feat: "
labels:
  - type/feature
  - status/needs-review
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a new capability or behavior.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this work needed?
      placeholder: Describe the current situation and why this capability is needed.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this feature provide?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What work is included?
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What related work is explicitly excluded?
      placeholder: |
        - ...
        - ...

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will completion be verified?
      value: |
        - [ ] The new behavior is available as described.
        - [ ] Existing behavior that must remain unchanged is preserved.
        - [ ] Relevant tests cover the new behavior.
        - [ ] Documentation is updated when public behavior or configuration changes.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link related issues, PRs, or external dependencies.

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional implementation details, measurements, constraints, or references.
