---
name: CI

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and format
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the pinned tools
        run: uv sync --locked

      # Every step below runs even when an earlier one failed, so one run reports everything.
      - name: yamllint
        run: uv run yamllint .
        if: ${{ !cancelled() }}
      - name: mdlint
        # `.github` is named because mdlint skips hidden directories it is not given.
        run: uv run mdlint check . .github
        if: ${{ !cancelled() }}
      - name: Workflow schema
        run: uv run check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
        if: ${{ !cancelled() }}
      - name: Issue form schema
        # `config.yml` is the chooser, not a form, and has its own schema below.
        run: |
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name config.yml \
            -exec uv run check-jsonschema --builtin-schema vendor.github-issue-forms {} +
        if: ${{ !cancelled() }}
      - name: Issue chooser schema
        run: uv run check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
        if: ${{ !cancelled() }}
      - name: Contract validation
        # Validates that issue and PR templates match the canonical contract (CONTRACT.yml).
        run: uv run python scripts/validate_contract.py
        if: ${{ !cancelled() }}
      - name: release-please schema
        # Pinned to a tag: `main` changes under the repository and fails it for no change of its own.
        run: |
          uv run check-jsonschema \
            --schemafile https://raw.githubusercontent.com/googleapis/release-please/v17.11.2/schemas/config.json \
            release-please-config.json
        if: ${{ !cancelled() }}
      - name: actionlint
        # `uv run` puts the venv on PATH, so actionlint finds the pinned shellcheck and pyflakes.
        run: uv run actionlint .github/workflows/*.yml
        if: ${{ !cancelled() }}
      - name: yamlfix
        # `-i` is required (the default include is `*.yaml`). The example file is skipped
        # because yamlfix deletes its commented blocks.
        run: uv run yamlfix --check -i '*.yml' -e '.cache/**' -e '.github/standards.local.example.yml' .
        if: ${{ !cancelled() }}
      - name: Table alignment
        run: uv run mdlint check --select MD060 . .github
        if: ${{ !cancelled() }}
