---
name: release-please

"on":
  push:
    branches: [main]
permissions: {}

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  # A new push must wait for a release in flight, not interrupt it halfway.
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The PAT sets the commit author, since release-please has no author setting.
      # See docs/releases.md.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_RELEASE_TOKEN }}
