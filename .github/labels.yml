# Shared GitHub Labels
# Reusable label standard for all repositories.
# Keep this file synchronized across projects.
#
# This file is the ORIGIN of the label set, and it is a manifest rather than workflow
# input: GitHub does not read it, no CI in this repository parses it, and editing it
# changes no remote label. Each consuming repository holds its own copy under its own
# `.github/`, and edits here do NOT propagate — there is no workflow, submodule or sync
# bot anywhere in this organisation that fetches it. Synchronization is a manual copy,
# so drift is expected and has to be checked for by hand.
#
# To apply this manifest to a repository, from that repository's root:
#
#   yq -r '.[] | "gh label create \"\(.name)\" --color \"\(.color)\" --description \"\(.description)\" --force"' \
#     .github/labels.yml | sh
#
# Drop the `| sh` to print it first. To audit rather than apply, diff against the
# remote and against this file; an empty diff means they agree. A label on the remote
# that neither file declares is drift in the other direction, and `--force` will not
# remove it: pruning is a separate, deliberate act.
#
# The quotes around each color are load bearing, not style. Unquoted, YAML reads
# `008672` as the number 8672 and `5319E7` as 53190000000, because it takes the `E`
# for an exponent — and `gh label create --color` would then be handed a number.
#
# The `type/*` family is five members and there is no `type/breaking-change`.
# `breaking-change` is a Conventional Commit type, not a label and not an issue type;
# the breaking signal lives in the commit, as `!` or a `BREAKING CHANGE:` footer,
# which is what release tooling reads.

- name: "type/bug"
  color: "D73A4A"
  description: "Something is not working as expected."

- name: "type/feature"
  color: "0075CA"
  description: "A new capability or user-facing functionality."

- name: "type/improvement"
  color: "A2EEEF"
  description: "An improvement to existing functionality."

- name: "type/task"
  color: "7057FF"
  description: "A defined piece of work that does not represent a feature or bug."

- name: "type/documentation"
  color: "0075CA"
  description: "Changes or additions to documentation."

- name: "priority/critical"
  color: "B60205"
  description: "Requires immediate attention because it critically impacts the project."

- name: "priority/high"
  color: "D93F0B"
  description: "Should be addressed with high priority."

- name: "priority/medium"
  color: "FBCA04"
  description: "Normal priority work that should be addressed as planned."

- name: "priority/low"
  color: "0E8A16"
  description: "Useful work that can be deferred when higher priorities exist."

- name: "status/blocked"
  color: "E4E669"
  description: "Work cannot proceed because an external dependency or decision is blocking it."

- name: "status/needs-review"
  color: "5319E7"
  description: "The issue or proposed solution requires review before proceeding."

- name: "status/ready"
  color: "0E8A16"
  description: "The issue is sufficiently defined and ready to be worked on."

- name: "status/in-progress"
  color: "1D76DB"
  description: "Work on this issue is currently in progress."

- name: "status/waiting"
  color: "CFD3D7"
  description: "Work is waiting for information, feedback, approval, or another action."

- name: "scope/frontend"
  color: "BFDADC"
  description: "Primarily affects the frontend or client-side application."

- name: "scope/backend"
  color: "D4C5F9"
  description: "Primarily affects backend application logic or services."

- name: "scope/api"
  color: "C5DEF5"
  description: "Primarily affects an API or integration contract."

- name: "scope/database"
  color: "FEF2C0"
  description: "Primarily affects database structure, queries, migrations, or data."

- name: "scope/devops"
  color: "1D76DB"
  description: "Primarily affects deployment, infrastructure, CI, or development tooling."

- name: "scope/testing"
  color: "FBCA04"
  description: "Primarily affects automated or manual testing."

- name: "scope/security"
  color: "B60205"
  description: "Primarily affects application or infrastructure security."

- name: "scope/documentation"
  color: "0075CA"
  description: "Primarily affects documentation or project guidance."

- name: "meta/dependency"
  color: "0366D6"
  description: "Related to a dependency update, dependency issue, or external package."

- name: "meta/duplicate"
  color: "CFD3D7"
  description: "This issue duplicates another issue."

- name: "meta/good-first-issue"
  color: "7057FF"
  description: "A suitable issue for someone contributing to the project for the first time."

- name: "meta/help-wanted"
  color: "008672"
  description: "Additional community or contributor assistance is welcome."

- name: "meta/wontfix"
  color: "FFFFFF"
  description: "The issue will not be addressed as part of the project."

- name: "github_actions"
  color: "000000"
  description: "Pull requests that update GitHub Actions code."

- name: "release/pending"
  color: "675300"
  description: "Release PR pending merge."

- name: "release/tagged"
  color: "73e6ae"
  description: "Already included in a tagged release."