[project]
name = "ailura-standards"
version = "0.2.0"
description = "Issue and pull request standards; tooling only, nothing is built"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
lint = [
  "actionlint-py==1.7.12.25",
  "check-jsonschema==0.38.2",
  "mdlint==0.3.0",
  "pyflakes==4.0.2",
  "shellcheck-py==0.11.0.1",
  "yamllint==1.38.0",
]

format = [
  "yamlfix==1.19.1",
]

[tool.uv]
package = false
default-groups = ["lint", "format"]

# Matches the repository's YAML style: double quotes, one blank line, flow lists kept as written,
# every document opening with `---`. Left on its defaults, yamlfix turns `"on":` into `on:` and
# expands `[a, b]` lists, which reintroduces the `truthy` warning and rewrites every template.
[tool.yamlfix]
preserve_quotes = true
quote_representation = '"'
sequence_style = "keep_style"
whitelines = 1
explicit_start = true
line_length = 120
comments_min_spacing = 2

[tool.mdlint]
exclude = [
  ".atl",
  ".cache",
  ".codegraph",
  ".odd",
  "CHANGELOG.md",
  "node_modules",
  "odd",
]

[tool.mdlint.rules.MD013]
line_length = 120
tables = false
code_blocks = false
